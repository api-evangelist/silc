aid: silc
name: SiLC
description: 'SiLC Technologies is a silicon photonics company headquartered in Monrovia,
  California that builds integrated single-chip FMCW (frequency-modulated continuous-wave)
  LiDAR — coherent 4D vision systems that capture depth, instantaneous velocity via
  micro-Doppler, and dual-polarization intensity from one photonic chip. Its Eyeonic
  product family spans Eyeonic Trace Ultra (a Class 1 laser line scanner for industrial
  automation and inspection), Eyeonic Vista (an ultra-long-range perimeter security
  and counter-UAS vision system with detection beyond 2 km), and Eyeonic Edge (high-precision
  4D inspection of large objects). The company sells sensors, modules and vision chips
  to industrial and AI robotics, perimeter security, and mobility customers. It was
  founded by Dr. Mehdi Asghari and is backed in part by Honda. SiLC ships hardware,
  not software services: as of this profile it publishes no public developer program,
  API, SDK, documentation portal, or machine-readable specification.'
